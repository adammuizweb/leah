server {
    listen 80;
    server_name leah.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name leah.example.com;

    ssl_certificate /etc/letsencrypt/live/leah.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leah.example.com/privkey.pem;

    root /opt/leah/frontend/dist;
    index index.html;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $leah_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
