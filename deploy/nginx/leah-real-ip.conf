# Install in /etc/nginx/conf.d/. Only Cloudflare Tunnel connects over loopback;
# direct LAN clients keep their actual Nginx peer address.
map $remote_addr $leah_tunnel_client_ip {
    default $remote_addr;
    127.0.0.1 $http_cf_connecting_ip;
    ::1 $http_cf_connecting_ip;
}

map $leah_tunnel_client_ip $leah_client_ip {
    default $leah_tunnel_client_ip;
    "" $remote_addr;
}
